<!DOCTYPE html>
<html>
<head>
    <title>StockShot - Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .top-right-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .auth-button-top {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .auth-button-top:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .user-status {
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-status.guest {
            background: #667eea;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- Top Right Container -->
    <div class="top-right-container">
        <div id="user-status" class="user-status guest">Guest</div>
        <a href="login.html" id="login-signup-btn" class="auth-button-top">Login / Sign Up</a>
        <button id="logout-btn" class="logout-btn" onclick="handleLogout()" style="display: none;">Logout</button>
    </div>

    <div class="container">
        <div class="logo-container">
            <img src="stockshot-logo.png" alt="StockShot Logo" style="height: 130px; width: auto;">
        </div>
        <p class="subtitle">Your Stock Predictor & Calculator</p>

        <div class="nav-buttons">
            <button class="active" onclick="showTab('search')">Stock Search</button>
            <button onclick="showTab('calculator')">Profit/Loss Calculator</button>
            <button onclick="showTab('prediction')">Price Prediction</button>
        </div>

        <div id="search-tab">
            <div class="search-box-wrapper">
                <div class="search-box">
                    <input type="text" id="stockInput" placeholder="Enter stock symbol (e.g., AAPL, MSFT)" autocomplete="off" style="width: 100%;" />
                </div>
                <div class="suggestions-dropdown" id="suggestionsDropdown"></div>
            </div>

            <div class="stock-info" id="stockInfo">
                <div class="stock-symbol" id="symbol"></div>
                <div class="stock-price" id="price"></div>
                <div class="stock-change">
                    Change: <span id="change"></span>
                </div>
                <div class="stock-change">
                    Change %: <span id="changePercent"></span>
                </div>
                <div class="chart-container">
                    <canvas id="priceChart" height="220"></canvas>
                </div>
            </div>
        </div>

        <div id="calculator-tab" style="display: none;">
            <div class="calculator-box">
                <h3 style="margin-bottom: 15px; color: #333;">Calculate Profit/Loss</h3>
                
                <div class="calc-input">
                    <input type="number" id="buyPrice" placeholder="Buy Price ($)" />
                    <input type="number" id="sellPrice" placeholder="Sell Price ($)" />
                    <button onclick="useLivePrice()" style="padding: 10px 15px; font-size: 14px;">Use Live Price</button>
                </div>

                <div class="calc-input">
                    <input type="number" id="quantity" placeholder="Quantity (shares)" />
                    <button onclick="calculateProfit()">Calculate</button>
                </div>

                <div class="calc-result" id="profitResult">
                    <div class="result-label">Total Profit/Loss</div>
                    <div class="result-value" id="profitValue">$0.00</div>
                    <div class="result-label" style="margin-top: 10px;">Profit/Loss %</div>
                    <div class="result-value" id="profitPercent" style="color: #27ae60;">0%</div>
                </div>
            </div>
        </div>

        <div id="prediction-tab" style="display: none;">
            <div class="calculator-box">
                <h3 style="margin-bottom: 15px; color: #333;">📊 Price Prediction</h3>
                
                <div class="search-box-wrapper">
                    <div class="calc-input">
                        <input type="text" id="predictionSymbol" placeholder="Enter stock symbol (e.g., AAPL)" autocomplete="off" />
                        <button onclick="getPrediction()">Predict</button>
                    </div>
                    <div class="suggestions-dropdown" id="predictionSuggestionsDropdown"></div>
                </div>

                <div class="calc-result" id="predictionResult">
                    <div class="result-label">Prediction</div>
                    <div class="result-value" id="predictionDirection">-</div>
                    <div class="result-label" style="margin-top: 10px;">Confidence</div>
                    <div class="result-value" id="predictionConfidence" style="color: #667eea;">-</div>
                    <div class="result-label" style="margin-top: 10px;">Recent Change</div>
                    <div class="result-value" id="predictionChange" style="color: #667eea;">-</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <!-- Your Auth Script -->
    <script src="auth.js"></script>

    <script>
        function useLivePrice() {
            const priceText = document.getElementById('price').textContent;
            if (!priceText) {
                alert('Please search a stock first!');
                return;
            }
    
            const price = parseFloat(priceText.replace('$', ''));
            document.getElementById('buyPrice').value = price;
            showTab('calculator');
        }

        function showTab(tab) {
            document.getElementById('search-tab').style.display = tab === 'search' ? 'block' : 'none';
            document.getElementById('calculator-tab').style.display = tab === 'calculator' ? 'block' : 'none';
            document.getElementById('prediction-tab').style.display = tab === 'prediction' ? 'block' : 'none';
            document.querySelectorAll('.nav-buttons button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        async function searchStock() {
            const input = document.getElementById('stockInput').value.toUpperCase();
            if (!input) {
                alert('Please enter a stock symbol');
                return;
            }

            hideSuggestions();

            try {
                const response = await fetch(`/api/stock/${input}`);
                const data = await response.json();

                if (!data.symbol) {
                    alert('Stock not found');
                    return;
                }

                document.getElementById('symbol').textContent = data.symbol;
                document.getElementById('price').textContent = `$${data.price}`;

                const changeElement = document.getElementById('change');
                const changePercentElement = document.getElementById('changePercent');

                changeElement.textContent = data.change;
                changePercentElement.textContent = data.changePercent;

                const isPositive = parseFloat(data.change) >= 0;
                changeElement.className = isPositive ? 'change-positive' : 'change-negative';
                changePercentElement.className = isPositive ? 'change-positive' : 'change-negative';

                document.getElementById('stockInfo').classList.add('show');

                renderPriceChart(data.symbol);
            } catch (error) {
                alert('Error fetching stock data');
            }
        }

        let priceChartInstance = null;

        async function renderPriceChart(symbol) {
            try {
                const response = await fetch(`/api/history/${symbol}`);
                if (!response.ok) return;
                const history = await response.json();

                if (!Array.isArray(history) || history.length === 0) return;

                const labels = history.map(point => point.date.slice(5));
                const closes = history.map(point => point.close);
                const trendPositive = closes[closes.length - 1] >= closes[0];

                const ctx = document.getElementById('priceChart').getContext('2d');

                if (priceChartInstance) {
                    priceChartInstance.destroy();
                }

                priceChartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: `${symbol} Close Price`,
                            data: closes,
                            borderColor: trendPositive ? '#27ae60' : '#e74c3c',
                            backgroundColor: trendPositive ? 'rgba(39, 174, 96, 0.1)' : 'rgba(231, 76, 60, 0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 0,
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                ticks: {
                                    callback: value => `$${value}`
                                }
                            }
                        }
                    }
                });
            } catch (error) {
                console.log('Error rendering chart:', error);
            }
        }

        function calculateProfit() {
            const buyPrice = parseFloat(document.getElementById('buyPrice').value);
            const sellPrice = parseFloat(document.getElementById('sellPrice').value);
            const quantity = parseFloat(document.getElementById('quantity').value);

            if (!buyPrice || !sellPrice || !quantity) {
                alert('Please fill in all fields');
                return;
            }

            const profitPerShare = sellPrice - buyPrice;
            const totalProfit = profitPerShare * quantity;
            const profitPercent = ((profitPerShare / buyPrice) * 100).toFixed(2);

            document.getElementById('profitValue').textContent = `$${totalProfit.toFixed(2)}`;
            document.getElementById('profitPercent').textContent = `${profitPercent}%`;

            const isPositive = totalProfit >= 0;
            document.getElementById('profitValue').className = 'result-value ' + (isPositive ? 'change-positive' : 'change-negative');
            document.getElementById('profitPercent').className = 'result-value ' + (isPositive ? 'change-positive' : 'change-negative');

            document.getElementById('profitResult').classList.add('show');
        }

        const stockInputEl = document.getElementById('stockInput');
        const suggestionsDropdown = document.getElementById('suggestionsDropdown');

        let debounceTimer = null;
        let searchRequestId = 0;
        let activeSuggestionIndex = -1;
        let currentSuggestions = [];

        function initialsAvatar(symbol) {
            const letter = (symbol || '?').charAt(0).toUpperCase();
            const colors = ['#667eea', '#e74c3c', '#27ae60', '#f39c12', '#8e44ad', '#16a085'];
            const color = colors[letter.charCodeAt(0) % colors.length];
            return `<div class="suggestion-avatar" style="background:${color}">${letter}</div>`;
        }

        function renderSuggestions(items) {
            currentSuggestions = items;
            activeSuggestionIndex = -1;

            if (!items || items.length === 0) {
                hideSuggestions();
                return;
            }

            suggestionsDropdown.innerHTML = items.map((item, index) => {
                const hasPrice = typeof item.price === 'number' && !isNaN(item.price);
                const isUp = item.isUp;
                const priceClass = hasPrice ? (isUp ? 'change-positive' : 'change-negative') : '';
                const arrow = hasPrice ? (isUp ? '▲' : '▼') : '';
                const priceText = hasPrice ? `$${item.price.toFixed(2)}` : '';

                const logo = item.logo
                    ? `<img class="suggestion-avatar" src="${item.logo}" alt="${item.symbol}" onerror="this.outerHTML = window.__initialsAvatar('${item.symbol.replace(/'/g, "")}')" />`
                    : initialsAvatar(item.symbol);

                return `
                    <div class="suggestion-item" data-index="${index}" onclick="selectSuggestion(${index})">
                        ${logo}
                        <div class="suggestion-info">
                            <div class="suggestion-symbol">${item.symbol}</div>
                            <div class="suggestion-name">${item.name}</div>
                        </div>
                        <div class="suggestion-price ${priceClass}">${priceText} ${arrow}</div>
                    </div>
                `;
            }).join('');

            suggestionsDropdown.classList.add('show');
        }

        window.__initialsAvatar = function(symbol) {
            return initialsAvatar(symbol);
        };

        function hideSuggestions() {
            suggestionsDropdown.classList.remove('show');
            suggestionsDropdown.innerHTML = '';
            currentSuggestions = [];
            activeSuggestionIndex = -1;
        }

        function selectSuggestion(index) {
            const item = currentSuggestions[index];
            if (!item) return;
            stockInputEl.value = item.symbol;
            hideSuggestions();
            searchStock();
        }

        function updateActiveSuggestion() {
            const rows = suggestionsDropdown.querySelectorAll('.suggestion-item');
            rows.forEach((row, i) => {
                row.classList.toggle('active', i === activeSuggestionIndex);
            });
        }

        async function fetchSuggestions(query) {
            const requestId = ++searchRequestId;
            try {
                const response = await fetch(`/api/search/${encodeURIComponent(query)}`);
                const data = await response.json();

                if (requestId !== searchRequestId) return;
                if (Array.isArray(data)) {
                    renderSuggestions(data.slice(0, 5));
                }
            } catch (error) {
                console.log('Error fetching suggestions:', error);
            }
        }

        stockInputEl.addEventListener('input', function() {
            const query = stockInputEl.value.trim();
            clearTimeout(debounceTimer);

            if (!query) {
                hideSuggestions();
                return;
            }

            debounceTimer = setTimeout(() => fetchSuggestions(query), 350);
        });

        stockInputEl.addEventListener('keydown', function(e) {
            const rows = suggestionsDropdown.querySelectorAll('.suggestion-item');

            if (e.key === 'ArrowDown' && rows.length > 0) {
                e.preventDefault();
                activeSuggestionIndex = Math.min(activeSuggestionIndex + 1, rows.length - 1);
                updateActiveSuggestion();
            } else if (e.key === 'ArrowUp' && rows.length > 0) {
                e.preventDefault();
                activeSuggestionIndex = Math.max(activeSuggestionIndex - 1, 0);
                updateActiveSuggestion();
            } else if (e.key === 'Enter') {
                if (activeSuggestionIndex >= 0 && currentSuggestions[activeSuggestionIndex]) {
                    e.preventDefault();
                    selectSuggestion(activeSuggestionIndex);
                } else {
                    searchStock();
                }
            } else if (e.key === 'Escape') {
                hideSuggestions();
            }
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-box-wrapper')) {
                hideSuggestions();
            }
        });

        async function getPrediction() {
            const symbol = document.getElementById('predictionSymbol').value.toUpperCase();
            if (!symbol) {
                alert('Please enter a stock symbol');
                return;
            }

            try {
                

                // Fetch prediction data
                const response = await fetch(`/api/predict/${symbol}`);
                const data = await response.json();

                if (!data || !data.direction) {
                    alert('Could not get prediction data');
                    return;
                }

                document.getElementById('predictionDirection').textContent = data.direction;
                document.getElementById('predictionConfidence').textContent = data.confidence.toFixed(0) + '%';
                document.getElementById('predictionChange').textContent = data.change + '%';

                const directionElement = document.getElementById('predictionDirection');
                if (data.direction === 'UP') {
                    directionElement.className = 'result-value change-positive';
                } else if (data.direction === 'DOWN') {
                    directionElement.className = 'result-value change-negative';
                } else {
                    directionElement.className = 'result-value';
                }

                document.getElementById('predictionResult').classList.add('show');
            } catch (error) {
                alert('Error getting prediction');
                console.log('Prediction error:', error);
            }
        }

        // Update user status
        if (typeof firebase !== 'undefined') {
            firebase.auth().onAuthStateChanged((user) => {
                const userStatus = document.getElementById('user-status');
                const loginSignupBtn = document.getElementById('login-signup-btn');
                const logoutBtn = document.getElementById('logout-btn');

                if (user) {
                    userStatus.textContent = '✓ ' + user.email;
                    userStatus.classList.remove('guest');
                    loginSignupBtn.style.display = 'none';
                    logoutBtn.style.display = 'block';
                } else {
                    userStatus.textContent = 'Guest';
                    userStatus.classList.add('guest');
                    loginSignupBtn.style.display = 'block';
                    logoutBtn.style.display = 'none';
                }
            });
        }
        const predictionInputEl = document.getElementById('predictionSymbol');
        const predictionDropdown = document.getElementById('predictionSuggestionsDropdown');
        let predictionDebounce = null;

        predictionInputEl.addEventListener('input', function() {
            const query = predictionInputEl.value.trim();
            clearTimeout(predictionDebounce);
            if (!query) { predictionDropdown.classList.remove('show'); predictionDropdown.innerHTML = ''; return; }
            predictionDebounce = setTimeout(async () => {
                const response = await fetch(`/api/search/${encodeURIComponent(query)}`);
                const data = await response.json();
                predictionDropdown.innerHTML = data.slice(0, 5).map(item => {
                    const logo = item.logo
                        ? `<img class="suggestion-avatar" src="${item.logo}" alt="${item.symbol}" onerror="this.outerHTML = window.__initialsAvatar('${item.symbol.replace(/'/g, "")}')" />`
                        : initialsAvatar(item.symbol);
                    return `
                    <div class="suggestion-item" onclick="document.getElementById('predictionSymbol').value='${item.symbol}'; document.getElementById('predictionSuggestionsDropdown').classList.remove('show');">
                        ${logo}
                        <div class="suggestion-info">
                            <div class="suggestion-symbol">${item.symbol}</div>
                            <div class="suggestion-name">${item.name}</div>
                        </div>
                    </div>
                `;
                }).join('');
                predictionDropdown.classList.add('show');
            }, 350);
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('#prediction-tab .search-box-wrapper')) {
                predictionDropdown.classList.remove('show');
            }
        });
    </script>   
</body>
</html>
