<!DOCTYPE html>
<html>
<head>
    <title>StockShot - Login</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .toggle-text {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 15px;
        }

        .toggle-text a {
            color: #667eea;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }

        .toggle-text a:hover {
            text-decoration: underline;
        }

        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-container input {
            flex: 1;
            padding-right: 50px;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            font-size: 20px;
            transition: all 0.2s ease;
        }

        .password-toggle:hover {
            transform: scale(1.1);
        }

        .eye-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .eye-icon::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 12px;
            border: 2px solid #555;
            border-radius: 50%;
        }

        .eye-icon::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #555;
            border-radius: 50%;
            z-index: 1;
        }

        .password-toggle.hidden .eye-icon::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 12px;
            border: 2px solid #555;
            border-radius: 50%;
        }

        .password-toggle.hidden .eye-icon::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 25px;
            background-color: #555;
            border-radius: 0;
            z-index: 1;
            transform: rotate(-45deg);
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            font-weight: 600;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        #signup-form {
            display: none;
        }

        .auth-button {
            width: 100%;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .subtitle-custom {
            color: #999;
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container auth-container">
        <!-- Login Form -->
        <div id="login-form" class="auth-form">
            <div style="text-align: center; margin-bottom: 30px;">
                <img src="stockshot-logo.png" alt="StockShot Logo" style="height: 120px; width: auto;">
            </div>
            <a href="index.html" style="display: inline-block; background: #667eea; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; margin-bottom: 20px; transition: all 0.2s ease;" onmouseover="this.style.background='#5a67d8'" onmouseout="this.style.background='#667eea'">← Back</a>
            <p class="subtitle-custom">Your Stock Predictor & Calculator</p>

            <div id="login-message" class="message"></div>

            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="Enter your email" />
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <div class="password-container">
                    <input type="password" id="login-password" placeholder="Enter your password" />
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('login-password', this)"><div class="eye-icon"></div></button>
                </div>
            </div>

            <button class="auth-button" onclick="handleLogin()">Login</button>

            <div class="toggle-text">
                Don't have an account? <a onclick="toggleAuthForm()">Sign Up</a>
            </div>
        </div>

        <!-- Sign Up Form -->
        <div id="signup-form" class="auth-form">
            <div style="text-align: center; margin-bottom: 30px;">
                <img src="stockshot-logo.png" alt="StockShot Logo" style="height: 120px; width: auto;">
            </div>
            <p class="subtitle-custom">Create Your Account</p>

            <div id="signup-message" class="message"></div>

            <div class="form-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" placeholder="Enter your email" />
            </div>

            <div class="form-group">
                <label for="signup-password">Password</label>
                <div class="password-container">
                    <input type="password" id="signup-password" placeholder="Enter your password (min 6 chars)" />
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signup-password', this)"><div class="eye-icon"></div></button>
                </div>
            </div>

            <div class="form-group">
                <label for="signup-confirm-password">Confirm Password</label>
                <input type="password" id="signup-confirm-password" placeholder="Confirm your password" />
            </div>

            <button class="auth-button" onclick="handleSignUp()">Sign Up</button>

            <div class="toggle-text">
                Already have an account? <a onclick="toggleAuthForm()">Login</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (compat version for v8 syntax) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <!-- Your Auth Script -->
    <script src="auth.js"></script>
    
    <script>
        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                button.classList.remove('hidden');
            } else {
                input.type = "password";
                button.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
